quarkus.http.port=8085
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9000

secret.master-key=test
gollek.rag.default-llm-model=test
gollek.rag.default-embedding-model=test
gollek.audio.whisper.default-model=test
gamelan.embedding.openai.api-key=test
gollek.admin.api-key=test

quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6379
gollek.hub.token=test

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc=false
quarkus.datasource.username=cifr
quarkus.datasource.password=cifr
quarkus.datasource.reactive.url=postgresql://localhost:5432/cifr
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.scheduler.enabled=false

# Force Quarkus to index CDI beans in all Cifr library jars at build time.
# Without this, beans in non-Quarkus library modules (no quarkus-maven-plugin) are invisible
# to the CDI deployment processor and cause UnsatisfiedResolutionException on startup.
quarkus.index-dependency.cifr-core.group-id=tech.kayys
quarkus.index-dependency.cifr-core.artifact-id=cifr-core
quarkus.index-dependency.cifr-indexing.group-id=tech.kayys
quarkus.index-dependency.cifr-indexing.artifact-id=cifr-indexing
quarkus.index-dependency.cifr-tools-api.group-id=tech.kayys
quarkus.index-dependency.cifr-tools-api.artifact-id=cifr-tools-api
quarkus.index-dependency.cifr-tools-builtin.group-id=tech.kayys
quarkus.index-dependency.cifr-tools-builtin.artifact-id=cifr-tools-builtin
quarkus.index-dependency.cifr-skills-api.group-id=tech.kayys
quarkus.index-dependency.cifr-skills-api.artifact-id=cifr-skills-api
quarkus.index-dependency.cifr-skills-builtin.group-id=tech.kayys
quarkus.index-dependency.cifr-skills-builtin.artifact-id=cifr-skills-builtin
quarkus.index-dependency.cifr-engine.group-id=tech.kayys
quarkus.index-dependency.cifr-engine.artifact-id=cifr-engine
quarkus.index-dependency.cifr-security.group-id=tech.kayys
quarkus.index-dependency.cifr-security.artifact-id=cifr-security
quarkus.index-dependency.cifr-standalone.group-id=tech.kayys
quarkus.index-dependency.cifr-standalone.artifact-id=cifr-standalone
quarkus.index-dependency.cifr-toolchain-api.group-id=tech.kayys
quarkus.index-dependency.cifr-toolchain-api.artifact-id=cifr-toolchain-api
quarkus.index-dependency.cifr-toolchain-adapters.group-id=tech.kayys
