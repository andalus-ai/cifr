syntax = "proto3";
package tech.kayys.aljabr.proto.agentrun;
option java_multiple_files = true;
option java_package = "tech.kayys.aljabr.proto.agentrun";
option java_outer_classname = "AgentRunProto";

message StartRunRequest {
  string session_id = 1;
  string request = 2;
}

message AgentRunMessage {
  string event = 1;
  map<string, string> data = 2;
}

service AgentRunService {
  rpc StartRun(StartRunRequest) returns (stream AgentRunMessage);
}
