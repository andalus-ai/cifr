# Default values for aljabr-platform Helm deployment.

global:
  environment: production
  imageRegistry: ghcr.io/kayys-tech
  imagePullSecrets: []

# ── Aljabr Agent & Substrate Backend ─────────────────────────────────────────
aljabr:
  replicaCount: 3
  image:
    repository: aljabr-backend
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8085
    grpcPort: 9000
  resources:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false

# ── Gollek Clustered GPU Inference Engine ────────────────────────────────────
gollek:
  replicaCount: 2
  image:
    repository: gollek-inference-server
    tag: "0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    httpPort: 8080
    grpcPort: 9090
  gpu:
    enabled: true
    type: "nvidia.com/gpu"
    count: 1
  resources:
    limits:
      cpu: 8000m
      memory: 32Gi
      nvidia.com/gpu: 1
    requests:
      cpu: 2000m
      memory: 8Gi
      nvidia.com/gpu: 1
  persistence:
    enabled: true
    storageClass: "fast-nvme"
    size: 200Gi
    mountPath: /models

# ── Enterprise Ingress ───────────────────────────────────────────────────────
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: aljabr.enterprise.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: aljabr-enterprise-tls
      hosts:
        - aljabr.enterprise.internal

# ── Enterprise Observability & OpenTelemetry ─────────────────────────────────
telemetry:
  openTelemetry:
    enabled: true
    collectorEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4317"
  prometheusMetrics:
    enabled: true
    path: /q/metrics
