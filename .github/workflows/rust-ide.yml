name: Cifr IDE Rust CI

on:
  pull_request:
    paths:
      - 'cifr-ide/**'
      - '.github/workflows/rust-ide.yml'
  push:
    branches:
      - main
    paths:
      - 'cifr-ide/**'
      - '.github/workflows/rust-ide.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cifr-rust-ide-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cifr-ide

jobs:
  rust:
    name: Rust workspace (stable)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cifr-ide -> target

      # The imported IDE tree predates this CI gate and contains widespread
      # formatting drift. Enforce rustfmt on every Rust file changed by a PR
      # without making unrelated legacy files block all future changes.
      - name: Check formatting of changed Rust files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.rs' | sed 's#^cifr-ide/##')"
          if [ -z "$changed" ]; then
            echo "No Rust source files changed; formatting check is not applicable."
          else
            printf '%s\n' "$changed" | xargs -r rustfmt --check --edition 2024
          fi

      - name: Check workspace and all targets
        run: cargo check --workspace --all-targets

      - name: Run workspace tests
        run: cargo test --workspace --all-targets

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
