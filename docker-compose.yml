version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: cifr
      POSTGRES_USER: cifr
      POSTGRES_PASSWORD: cifr
    ports:
      - "5432:5432"
    volumes:
      - ./.cifr/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./.cifr/data/redis:/data
    restart: unless-stopped
