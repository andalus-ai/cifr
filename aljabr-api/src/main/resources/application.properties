quarkus.http.port=8085
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9000

secret.master-key=test
gollek.rag.default-llm-model=test
gollek.rag.default-embedding-model=test
gollek.audio.whisper.default-model=test
gamelan.embedding.openai.api-key=test
gollek.admin.api-key=test

quarkus.redis.devservices.enabled=false
quarkus.redis.hosts=redis://localhost:6379
gollek.hub.token=test

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc=false
quarkus.datasource.username=aljabr
quarkus.datasource.password=aljabr
quarkus.datasource.reactive.url=postgresql://localhost:5432/aljabr
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.scheduler.enabled=false

# Force Quarkus to index CDI beans in all Aljabr library jars at build time.
# Without this, beans in non-Quarkus library modules (no quarkus-maven-plugin) are invisible
# to the CDI deployment processor and cause UnsatisfiedResolutionException on startup.
quarkus.index-dependency.aljabr-core.group-id=tech.kayys
quarkus.index-dependency.aljabr-core.artifact-id=aljabr-core
quarkus.index-dependency.aljabr-indexing.group-id=tech.kayys
quarkus.index-dependency.aljabr-indexing.artifact-id=aljabr-indexing
quarkus.index-dependency.aljabr-tools-api.group-id=tech.kayys
quarkus.index-dependency.aljabr-tools-api.artifact-id=aljabr-tools-api
quarkus.index-dependency.aljabr-tools-builtin.group-id=tech.kayys
quarkus.index-dependency.aljabr-tools-builtin.artifact-id=aljabr-tools-builtin
quarkus.index-dependency.aljabr-skills-api.group-id=tech.kayys
quarkus.index-dependency.aljabr-skills-api.artifact-id=aljabr-skills-api
quarkus.index-dependency.aljabr-skills-builtin.group-id=tech.kayys
quarkus.index-dependency.aljabr-skills-builtin.artifact-id=aljabr-skills-builtin
quarkus.index-dependency.aljabr-engine.group-id=tech.kayys
quarkus.index-dependency.aljabr-engine.artifact-id=aljabr-engine
quarkus.index-dependency.aljabr-security.group-id=tech.kayys
quarkus.index-dependency.aljabr-security.artifact-id=aljabr-security
