version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aljabr
      POSTGRES_USER: aljabr
      POSTGRES_PASSWORD: aljabr
    ports:
      - "5432:5432"
    volumes:
      - ./.aljabr/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./.aljabr/data/redis:/data
    restart: unless-stopped
